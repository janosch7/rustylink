[package]
name = "rustylink"
version = "2.0.0"
edition = "2024"
homepage = "https://github.com/ulikoehler/rustylink"
repository = "https://github.com/ulikoehler/rustylink"
description = "Visualize & analyze Simulink .slx files"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
camino = "1.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.3"
rayon = "1.11"
html-escape = "0.2"
quick-xml = "0.39"
bincode = { version = "2.0.1", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
once_cell = "1.20"

[features]
# Optional GUI visualization using egui/eframe
highlight = ["dep:syntect"]
egui = [
	"dep:eframe",
	"dep:egui",
	"dep:egui_extras",
	"dep:rfd",
	"dep:resvg",
	"dep:rust-embed",
	"dep:syntect",
	"dep:liveplot",
	"dep:egui-phosphor",
]
## Optional mask evaluation (parses very small subset of MATLAB mask scripts to show display text)
mask = []
## Enable interactive dashboard elements (custom widget renderers, liveplot scopes, editable constants).
## Without this feature, dashboard blocks render with simple icons only.
dashboard = ["egui"]

[dependencies.egui]
version = "0.34"
optional = true

[dependencies.eframe]
version = "0.34"
optional = true
default-features = true
features = ["wgpu"]

[dependencies.syntect]
version = "5.3"
optional = true

[dependencies.egui_extras]
version = "0.34"
optional = true
default-features = false
features = ["svg"]

[dependencies.resvg]
version = "0.45.1"
optional = true
default-features = false
features = ["text", "system-fonts"]

[dependencies.rust-embed]
version = "8.11.0"
optional = true
features = ["compression"]

[dependencies.liveplot]
#git = "https://github.com/ulikoehler/liveplot-rs"
#branch = "master"
version = "2.0.3"
optional = true
default-features = false
features = ["tiles", "fft", "parquet"]

[dependencies.rfd]
version = "0.17.2"
optional = true

[dependencies.egui-phosphor]
version = "0.7"
optional = true

[dev-dependencies]
tempfile = "3.10"

[[test]]
name = "block_catalog"
path = "tests/block_catalog.rs"
required-features = ["egui"]

[[test]]
name = "dashboard_ui_blocks"
path = "tests/dashboard_ui_blocks.rs"
required-features = ["dashboard"]

[[test]]
name = "editor_block_catalog"
path = "tests/editor_block_catalog.rs"
required-features = ["egui"]

[[test]]
name = "editor_selection"
path = "tests/editor_selection.rs"
required-features = ["egui"]

[[test]]
name = "editor_state"
path = "tests/editor_state.rs"
required-features = ["egui"]

[[test]]
name = "editor_ui"
path = "tests/editor_ui.rs"
required-features = ["egui"]

[[test]]
name = "egui_app_render"
path = "tests/egui_app_render.rs"
required-features = ["egui"]

[[test]]
name = "egui_app_ui"
path = "tests/egui_app_ui.rs"
required-features = ["egui"]

[[test]]
name = "library_resolver"
path = "tests/library_resolver.rs"
required-features = ["egui"]

[[test]]
name = "parser_tests"
path = "tests/parser_tests.rs"
required-features = ["egui"]

[[test]]
name = "user_virtual_library"
path = "tests/user_virtual_library.rs"
required-features = ["egui"]
